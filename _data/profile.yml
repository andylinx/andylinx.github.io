short_bio: >-
  <p>I am a junior undergraduate in the JohnClass at <a href="https://en.zhiyuan.sjtu.edu.cn/" target="_blank">Zhiyuan College</a>, <a href="https://en.sjtu.edu.cn/" target="_blank">Shanghai Jiao Tong University</a>, majoring in Computer Science.</p>
  <p>I am currently advised by Prof. <a href="https://xiaocw11.github.io/" target="_blank">Chaowei Xiao</a> at <a href="https://ai.jhu.edu/" target="_blank">Johns Hopkins University</a>. Previously, I worked with Prof. <a href="https://dirtyharrylyl.github.io/" target="_blank">Yong-Lu Li</a> in the <a href="https://mvig-rhos.com/" target="_blank">RHOS Lab</a> at SJTU and interned at Tencent XuanWu Lab.</p>
  <p>My research interests include multimodal learning, AI safety, and model security. I am always open to discussions and potential collaborations.</p>

